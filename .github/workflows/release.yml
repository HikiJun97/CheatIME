name: Build and release

on:
  pull_request:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Show toolchain
        run: |
          xcodebuild -version
          swiftc --version

      - name: Check version and build number
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version=$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' Info.plist)
          test "v$version" = "$GITHUB_REF_NAME"
          build=$(/usr/libexec/PlistBuddy -c 'Print CFBundleVersion' Info.plist)
          highest=0
          for tag in $(git tag -l 'v*' | grep -vx "$GITHUB_REF_NAME"); do
            tag_build=$(git show "$tag:Info.plist" | plutil -extract CFBundleVersion raw -o - -)
            if [ "$tag_build" -gt "$highest" ]; then highest=$tag_build; fi
          done
          echo "CFBundleVersion $build, highest in other v* tags $highest"
          test "$build" -gt "$highest"

      - name: Import the signing certificate
        if: startsWith(github.ref, 'refs/tags/')
        env:
          SIGNING_CERTIFICATE: ${{ secrets.SIGNING_CERTIFICATE }}
          SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.SIGNING_CERTIFICATE_PASSWORD }}
        run: |
          test -n "$SIGNING_CERTIFICATE"
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password=$(openssl rand -base64 24)
          printf '%s' "$SIGNING_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/signing.p12"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$RUNNER_TEMP/signing.p12" -k "$keychain" -P "$SIGNING_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain" > /dev/null
          rm "$RUNNER_TEMP/signing.p12"
          echo "SIGN_IDENTITY=$(sed -n 's/^SIGN_CERT := //p' Makefile)" >> "$GITHUB_ENV"
          echo "SIGN_KEYCHAIN=$keychain" >> "$GITHUB_ENV"

      - name: Build DMG and ZIP
        run: make dist

      - name: Check the release signature
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          cert=$(sed -n 's/^SIGN_CERT := //p' Makefile)
          codesign --verify --strict -R="certificate leaf = H\"$cert\"" CheatIME.app

      - name: Delete the signing keychain
        if: always() && startsWith(github.ref, 'refs/tags/')
        run: |
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true
          rm -f "$RUNNER_TEMP/signing.p12"

      - name: Sign the update and write the appcast
        if: startsWith(github.ref, 'refs/tags/')
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          test -n "$SPARKLE_PRIVATE_KEY"
          key="$RUNNER_TEMP/sparkle.key"
          printf '%s' "$SPARKLE_PRIVATE_KEY" > "$key"
          make appcast SPARKLE_KEY="$key"
          rm -f "$key"
          cat dist/appcast.xml

      - uses: actions/upload-artifact@v4
        with:
          name: CheatIME
          path: dist/*

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/download-artifact@v4
        with:
          name: CheatIME
          path: dist

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* --draft --repo "$GITHUB_REPOSITORY" \
            --title "CheatIME ${GITHUB_REF_NAME#v}" \
            --notes-file .github/release-notes.md
