name: Build and release

on:
  pull_request:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Show toolchain
        run: |
          xcodebuild -version
          swiftc --version

      - name: Check version and build number
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version=$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' Info.plist)
          test "v$version" = "$GITHUB_REF_NAME"
          build=$(/usr/libexec/PlistBuddy -c 'Print CFBundleVersion' Info.plist)
          previous=$(git tag -l 'v*' --sort=-v:refname | grep -vx "$GITHUB_REF_NAME" | head -n 1)
          if [ -n "$previous" ]; then
            git show "$previous:Info.plist" > "$RUNNER_TEMP/previous.plist"
            previous_build=$(/usr/libexec/PlistBuddy -c 'Print CFBundleVersion' "$RUNNER_TEMP/previous.plist")
            echo "CFBundleVersion $build, $previous has $previous_build"
            test "$build" -gt "$previous_build"
          fi

      - name: Build DMG and ZIP
        run: make dist

      - name: Sign the update and write the appcast
        if: startsWith(github.ref, 'refs/tags/')
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          test -n "$SPARKLE_PRIVATE_KEY"
          key="$RUNNER_TEMP/sparkle.key"
          printf '%s' "$SPARKLE_PRIVATE_KEY" > "$key"
          make appcast SPARKLE_KEY="$key"
          rm -f "$key"
          cat dist/appcast.xml

      - uses: actions/upload-artifact@v4
        with:
          name: CheatIME
          path: dist/*

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/download-artifact@v4
        with:
          name: CheatIME
          path: dist

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* --draft --repo "$GITHUB_REPOSITORY" \
            --title "CheatIME ${GITHUB_REF_NAME#v}" \
            --notes-file .github/release-notes.md
